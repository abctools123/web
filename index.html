<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browser-based Litematica schematic analyzer. Parse .litematic files locally to generate material lists, block counts, and stack calculations — no uploads required.">
<title>Litematica Material List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d0f0e;
    --bg2:       #131614;
    --bg3:       #1a1d1b;
    --border:    #2a2e2b;
    --border2:   #3a3f3c;
    --green:     #4ade80;
    --green-dim: #22543d;
    --green-mid: #16a34a;
    --amber:     #fbbf24;
    --amber-dim: #451a03;
    --red:       #f87171;
    --text:      #e2e8e4;
    --text2:     #8fa395;
    --text3:     #526358;
    --slot-bg:   #1e2320;
    --slot-border: #3d4a40;
    --font-mono: 'JetBrains Mono', monospace;
    --font-head: 'Rajdhani', sans-serif;
    --radius:    4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── scanline grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── layout ── */
  .shell {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ── header ── */
  header {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo-block { display: flex; flex-direction: column; gap: 2px; }
  .logo-title {
    font-family: var(--font-head);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
    line-height: 1;
  }
  .logo-sub {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .header-tag {
    margin-left: auto;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text3);
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: var(--radius);
  }

  /* ── drop zone ── */
  #dropzone {
    border: 1px dashed var(--border2);
    border-radius: 6px;
    background: var(--bg2);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  #dropzone:hover, #dropzone.dragover {
    border-color: var(--green-mid);
    background: #0f1a12;
  }
  #dropzone input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    font-size: 36px;
    margin-bottom: 12px;
    display: block;
    opacity: 0.4;
  }
  .drop-label {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text2);
    text-transform: uppercase;
  }
  .drop-hint {
    margin-top: 6px;
    color: var(--text3);
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  /* ── progress ── */
  #progress-wrap {
    display: none;
    margin-top: 16px;
  }
  .progress-bar-track {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.2s ease;
    border-radius: 1px;
  }
  .progress-label {
    margin-top: 6px;
    color: var(--text3);
    font-size: 11px;
  }

  /* ── error ── */
  #error-box {
    display: none;
    margin-top: 16px;
    background: #1a0a0a;
    border: 1px solid #4a1010;
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--red);
    font-size: 12px;
  }

  /* ── results section ── */
  #results { display: none; margin-top: 28px; }

  /* schematic info bar */
  .info-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  .info-name {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .info-chip {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: var(--radius);
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    white-space: nowrap;
  }
  .info-chip.green { color: var(--green); border-color: var(--green-dim); background: #0b1a10; }

  /* toolbar */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    align-items: center;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }
  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
    font-size: 15px;
  }
  #search-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 10px 7px 30px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search-input:focus { border-color: var(--green-mid); }
  #search-input::placeholder { color: var(--text3); }

  .btn-group { display: flex; gap: 4px; }
  .btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.1s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border2); color: var(--text); }
  .btn.active { background: #0b1a10; border-color: var(--green-mid); color: var(--green); }


  /* category pills */
  .cat-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }
  .btn-cat {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 3px 12px; border-radius: 20px;
    cursor: pointer; font-size: 10px; font-family: var(--mono);
    transition: 0.15s; text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .btn-cat:hover { border-color: var(--green-dim); color: #fff; }
  .btn-cat.active { background: var(--green-mid); color: #000; border-color: var(--green-mid); font-weight: 600; }
  .btn-export {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.1s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn-export:hover { border-color: var(--green-mid); color: var(--green); }

  /* column headers */
  .list-header {
    display: grid;
    grid-template-columns: 24px 1fr auto;
    gap: 0 12px;
    align-items: center;
    padding: 5px 10px;
    margin-bottom: 2px;
    color: var(--text3);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  /* ── material list ── */
  #material-list { list-style: none; }

  .mat-entry {
    display: grid;
    grid-template-columns: 24px 1fr auto;
    gap: 0 12px;
    align-items: center;
    padding: 4px 10px;
    border-radius: var(--radius);
    transition: background 0.08s;
    cursor: default;
  }
  .mat-entry:hover { background: var(--bg2); }
  .mat-entry + .mat-entry { margin-top: 1px; }

  /* icon slot — mimics Minecraft inventory slot */
  .mat-icon {
    width: 24px;
    height: 24px;
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    position: relative;
    image-rendering: pixelated;
    overflow: hidden;
  }
  .mat-icon img {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    display: block;
  }
  .mat-icon.no-img { font-size: 9px; color: var(--text3); text-align: center; line-height: 1.1; }

  /* name column */
  .mat-name-col {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .mat-name {
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mat-id {
    color: var(--text3);
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* count column */
  .mat-count-col {
    text-align: right;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .mat-total {
    color: var(--amber);
    font-size: 13px;
    font-weight: 600;
  }
  .mat-breakdown {
    color: var(--text3);
    font-size: 10px;
    margin-top: 1px;
  }

  /* ── region tabs ── */
  .region-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 16px;
  }
  .rtab {
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.1s;
    text-transform: uppercase;
  }
  .rtab:hover { border-color: var(--border2); color: var(--text); }
  .rtab.active { background: #0b1a10; border-color: var(--green-mid); color: var(--green); }

  /* ── footer stats ── */
  .stats-footer {
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--text3);
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .stats-footer span strong { color: var(--text2); }

  /* ── toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: var(--radius);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 1000;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* kbd hints */
  .kbd-hints {
    display: none;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-top: 10px;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.05em;
  }
  .kbd-hints.visible { display: flex; }
  .kbd-hints span {
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 2px;
    cursor: default;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  @media (max-width: 480px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .info-bar { flex-direction: column; align-items: flex-start; }
    .logo-title { font-size: 20px; }
    .btn-group { flex-wrap: wrap; }
    .btn-export { padding: 6px 10px; font-size: 11px; }
    .cat-pills { gap: 3px; }
    .btn-cat { padding: 2px 8px; font-size: 9px; }
    .list-header { font-size: 10px; }
    .mat-entry { grid-template-columns: 28px 1fr 80px; gap: 6px; padding: 5px 8px; }
    .mat-name { font-size: 12px; }
    .mat-id { font-size: 9px; }
    .mat-total { font-size: 13px; }
    .mat-icon { width: 24px; height: 24px; }
    .kbd-hints { font-size: 10px; gap: 8px; }
    .stats-footer { flex-direction: column; gap: 4px; text-align: center; }
  }
</style>
</head>
<body>

<div class="shell">

  <header>
    <div class="logo-block">
      <div class="logo-title">Litematica</div>
      <div class="logo-sub">Material List &nbsp;·&nbsp; browser-based schematic analyzer</div>
    </div>
    <div class="header-tag" id="btn-new" style="cursor:pointer;display:none;">+ New file</div>
  <div class="header-tag" id="btn-scanline" style="cursor:pointer;">CRT: on</div>
  </header>

  <div id="dropzone">
    <input type="file" id="file-input" accept=".litematic">
    <span class="drop-icon">⬡</span>
    <div class="drop-label">Drop .litematic file here</div>
    <div class="drop-hint">or click to browse &nbsp;·&nbsp; all processing is local, nothing is ever uploaded</div>
  </div>

  <div id="progress-wrap">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-label" id="progress-label">Reading file…</div>
  </div>

  <div id="error-box"></div>

  <div id="results">
    <div class="info-bar">
      <div class="info-name" id="schem-name"></div>
      <div class="info-chip green" id="chip-blocks"></div>
      <div class="info-chip" id="chip-regions"></div>
      <div class="info-chip" id="chip-author"></div>
    </div>

    <div class="region-tabs" id="region-tabs"></div>

    <div class="toolbar">
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Filter blocks…" autocomplete="off">
      </div>
      <div class="cat-pills" id="cat-pills">
        <button class="btn-cat active" data-cat="">All</button>
        <button class="btn-cat" data-cat="stone">Stone</button>
        <button class="btn-cat" data-cat="wood">Wood</button>
        <button class="btn-cat" data-cat="plants">Plants</button>
        <button class="btn-cat" data-cat="metal">Metal</button>
        <button class="btn-cat" data-cat="redstone">Redstone</button>
        <button class="btn-cat" data-cat="decor">Decor</button>
        <button class="btn-cat" data-cat="misc">Misc</button>
      </div>
      <div class="btn-group">
        <button class="btn active" id="sort-count">Count ↓</button>
        <button class="btn" id="sort-name">Name</button>
      </div>
      <button class="btn-export" id="btn-copy">Copy</button>
      <button class="btn-export" id="btn-csv">CSV</button>
      <button class="btn-export" id="btn-json">JSON</button>
      <button class="btn-export" id="btn-md">MD</button>
    </div>
    <div class="kbd-hints" id="kbd-hints">
      <span title="Ctrl+K">⌘K Search</span>
      <span title="Ctrl+S">⌘S Sort</span>
      <span title="Esc">Esc Clear</span>
    </div>

    <div class="list-header">
      <span></span>
      <span>Block</span>
      <span>Count</span>
    </div>

    <ul id="material-list"></ul>

    <div class="stats-footer" id="stats-footer"></div>
  </div>

</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  NBT PARSER  — big-endian binary, no dependencies
// ═══════════════════════════════════════════════════════════
const TAG = {
  END:9999, BYTE:1, SHORT:2, INT:3, LONG:4, FLOAT:5,
  DOUBLE:6, BYTE_ARRAY:7, STRING:8, LIST:9, COMPOUND:10,
  INT_ARRAY:11, LONG_ARRAY:12
};

class NBTReader {
  constructor(buf) {
    this.v   = new DataView(buf);
    this.pos = 0;
  }
  u8()  { return this.v.getUint8(this.pos++); }
  i8()  { return this.v.getInt8(this.pos++); }
  i16() { const n = this.v.getInt16(this.pos, false); this.pos+=2; return n; }
  i32() { const n = this.v.getInt32(this.pos, false); this.pos+=4; return n; }
  // Return BigInt for 64-bit longs — needed for bit-packing
  i64() {
    const hi = this.v.getInt32(this.pos,   false);
    const lo = this.v.getUint32(this.pos+4, false);
    this.pos += 8;
    return (BigInt(hi) << 32n) | BigInt(lo);
  }
  f32() { const n = this.v.getFloat32(this.pos, false); this.pos+=4; return n; }
  f64() { const n = this.v.getFloat64(this.pos, false); this.pos+=8; return n; }
  str() {
    const len = this.v.getUint16(this.pos, false); this.pos+=2;
    const bytes = new Uint8Array(this.v.buffer, this.pos, len);
    this.pos += len;
    return new TextDecoder().decode(bytes);
  }
  readPayload(type) {
    switch(type) {
      case TAG.BYTE:       return this.i8();
      case TAG.SHORT:      return this.i16();
      case TAG.INT:        return this.i32();
      case TAG.LONG:       return this.i64();
      case TAG.FLOAT:      return this.f32();
      case TAG.DOUBLE:     return this.f64();
      case TAG.BYTE_ARRAY: { const l=this.i32(); const a=new Int8Array(l); for(let i=0;i<l;i++) a[i]=this.i8(); return a; }
      case TAG.STRING:     return this.str();
      case TAG.LIST:       {
        const et=this.u8(), l=this.i32(), a=[];
        for(let i=0;i<l;i++) a.push(this.readPayload(et));
        return { _listType: et, value: a };
      }
      case TAG.COMPOUND:   {
        const obj={};
        while(true) {
          const t=this.u8();
          if(t===0) break;
          const n=this.str();
          obj[n]=this.readPayload(t);
        }
        return obj;
      }
      case TAG.INT_ARRAY:  { const l=this.i32(); const a=new Int32Array(l); for(let i=0;i<l;i++) a[i]=this.i32(); return a; }
      case TAG.LONG_ARRAY: { const l=this.i32(); const a=[]; for(let i=0;i<l;i++) a.push(this.i64()); return a; }
    }
  }
  readRoot() {
    const type = this.u8();
    this.str(); // root name (usually empty)
    return this.readPayload(type);
  }
}

// ═══════════════════════════════════════════════════════════
//  BIT ARRAY  — matches Litematica's LitematicaBitArray
//  bits_per_entry = max(2, ceil(log2(palette_size)))
//  NO straddling: each long contains floor(64 / bpe) entries
// ═══════════════════════════════════════════════════════════
function decodeBitArray(longs, numEntries, paletteSize) {
  if (!longs || !longs.length || numEntries <= 0) return new Int32Array(0);
  const bpe = Math.max(2, Math.ceil(Math.log2(paletteSize)));
  const mask = (1n << BigInt(bpe)) - 1n;
  const entriesPerLong = Math.floor(64 / bpe);
  const result = new Int32Array(numEntries);

  for (let i = 0; i < numEntries; i++) {
    const longIndex = Math.floor(i / entriesPerLong);
    const bitOffset = (i % entriesPerLong) * bpe;
    const raw = longs[longIndex];
    if (raw === undefined || raw === null) { result[i] = 0; continue; }
    // Some NBT parsers return longs as [hi, lo] pairs instead of BigInt
    const big = Array.isArray(raw) ? (BigInt(raw[0]) << 32n | (BigInt(raw[1]) & 0xFFFFFFFFn)) : BigInt(raw);
    const val = (big >> BigInt(bitOffset)) & mask;
    result[i] = Number(val);
  }
  return result;
}

// ═══════════════════════════════════════════════════════════
//  BLOCK → ITEM MAPPING
//  Blocks that don't drop themselves get mapped to their item
// ═══════════════════════════════════════════════════════════
const BLOCK_TO_ITEM = {
  'minecraft:wall_torch':         'minecraft:torch',
  'minecraft:soul_wall_torch':    'minecraft:soul_torch',
  'minecraft:redstone_wall_torch':'minecraft:redstone_torch',
  'minecraft:wall_sign':          'minecraft:oak_sign',
  'minecraft:oak_wall_sign':      'minecraft:oak_sign',
  'minecraft:spruce_wall_sign':   'minecraft:spruce_sign',
  'minecraft:birch_wall_sign':    'minecraft:birch_sign',
  'minecraft:jungle_wall_sign':   'minecraft:jungle_sign',
  'minecraft:acacia_wall_sign':   'minecraft:acacia_sign',
  'minecraft:dark_oak_wall_sign': 'minecraft:dark_oak_sign',
  'minecraft:mangrove_wall_sign': 'minecraft:mangrove_sign',
  'minecraft:cherry_wall_sign':   'minecraft:cherry_sign',
  'minecraft:crimson_wall_sign':  'minecraft:crimson_sign',
  'minecraft:warped_wall_sign':   'minecraft:warped_sign',
  'minecraft:bamboo_wall_sign':   'minecraft:bamboo_sign',
  'minecraft:wall_hanging_sign':  'minecraft:oak_hanging_sign',

function blockIdToName(id) {
  // Strip namespace
  const base = id.replace(/^minecraft:/, '').replace(/^[a-z]+:/, '');
  return base.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

// ═══════════════════════════════════════════════════════════
//  COUNT FORMATTING  — exact match of MaterialListHudRenderer
//  format: count > 1 stack:
//    if box >= 1.0:   "count (x.xx SB)"
//    elif stacks+rem: "count (stacks × 64 + rem)"
//    elif stacks:     "count (stacks × 64)"
//  maxStackSize defaults 64; some items are 16
// ═══════════════════════════════════════════════════════════
const STACK16 = new Set([
  'minecraft:ender_pearl','minecraft:snowball','minecraft:egg',
  'minecraft:bucket','minecraft:water_bucket','minecraft:lava_bucket',
  'minecraft:milk_bucket','minecraft:powder_snow_bucket',
  'minecraft:salmon_bucket','minecraft:cod_bucket','minecraft:tropical_fish_bucket',
  'minecraft:axolotl_bucket','minecraft:tadpole_bucket','minecraft:pufferfish_bucket',
  'minecraft:sign','minecraft:oak_sign','minecraft:spruce_sign','minecraft:birch_sign',
  'minecraft:jungle_sign','minecraft:acacia_sign','minecraft:dark_oak_sign',
  'minecraft:mangrove_sign','minecraft:cherry_sign','minecraft:crimson_sign',
  'minecraft:warped_sign','minecraft:bamboo_sign',
]);
function maxStack(itemId) {
  return STACK16.has(itemId) ? 16 : 64;
}

function formatCount(count, maxStackSize) {
  const stacks = Math.floor(count / maxStackSize);
  const remainder = count % maxStackSize;
  const boxCount = count / (27 * maxStackSize);

  if (count > maxStackSize) {
    if (boxCount >= 1.0) {
      return {
        total: count.toLocaleString(),
        detail: `(${boxCount.toFixed(2)} SB)`
      };
    } else if (remainder > 0) {
      return {
        total: count.toLocaleString(),
        detail: `(${stacks} × ${maxStackSize} + ${remainder})`
      };
    } else {
      return {
        total: count.toLocaleString(),
        detail: `(${stacks} × ${maxStackSize})`
      };
    }
  }
  return { total: count.toLocaleString(), detail: '' };
}

// ═══════════════════════════════════════════════════════════
//  SCHEMATIC PARSER
// ═══════════════════════════════════════════════════════════
function parseSchematic(nbt) {
  // Support old format with "Schematic" wrapper
  const root = nbt['Schematic'] ?? nbt;
  const meta = root['Metadata'];
  const name     = meta?.['Name']   ?? 'Unknown';
  const author   = meta?.['Author'] ?? '';

  // Support "Regions" (plural) and "Region" (singular, old format)
  let regionsNbt = root['Regions'] ?? root['Region'];
  if (!regionsNbt) return { name, author, regions: {} };
  // Wrap single-region format into an object keyed by name
  if (!regionsNbt['Size'] && regionsNbt['BlockStatePalette']) {
    regionsNbt = { 'Region': regionsNbt };
  }

  const regions = {};

  for (const [regionName, regionData] of Object.entries(regionsNbt)) {
    // Support "Palette" (old) and "BlockStatePalette" (modern)
    const palette = regionData['BlockStatePalette'] ?? regionData['Palette'];
    if (!palette) continue;

    const palArray = palette.value ?? palette;
    const paletteIds = palArray.map(entry => {
      // Entry can be a compound {Name: "...", Properties: {...}} OR a plain string
      if (typeof entry === 'string' || typeof entry === 'number') return String(entry);
      const name = entry['Name'];
      return typeof name === 'string' ? name : String(name);
    });

    const sizeX = Number(regionData['Size']?.['x'] ?? 0);
    const sizeY = Number(regionData['Size']?.['y'] ?? 0);
    const sizeZ = Number(regionData['Size']?.['z'] ?? 0);
    const volume = Math.abs(sizeX) * Math.abs(sizeY) * Math.abs(sizeZ);

    let blockStates = regionData['BlockStates'];
    if (!blockStates || volume === 0) continue;
    // NBT parsers may wrap long-array in {_listType, value}
    if (!Array.isArray(blockStates)) {
      blockStates = blockStates.value ?? [];
    }
    if (!Array.isArray(blockStates) || blockStates.length === 0) continue;

    const indices = decodeBitArray(blockStates, volume, paletteIds.length);

    const counts = {};
    for (let i = 0; i < volume; i++) {
      const idx = indices[i];
      if (idx < 0 || idx >= paletteIds.length) continue;
      const blockId = paletteIds[idx];
      if (AIR_BLOCKS.has(blockId)) continue;

      // Map wall/double-tall variants to their item ID
      const baseId = blockId.split('[')[0];
      const mapped = BLOCK_TO_ITEM[baseId];
      if (mapped === null) continue; // explicitly non-obtainable
      const itemId = mapped ?? baseId;

      counts[itemId] = (counts[itemId] ?? 0) + 1;
    }

    regions[regionName] = counts;
  }

  return { name, author, regions };
}

function mergeRegions(regions) {
  const merged = {};
  for (const counts of Object.values(regions)) {
    for (const [id, n] of Object.entries(counts)) {
      merged[id] = (merged[id] ?? 0) + n;
    }
  }
  return merged;
}

  const b = document.getElementById('error-box');

function getActiveCounts() {
  const { parsed, activeRegion } = state;
  if (!parsed) return {};
  if (activeRegion === '__all__') return mergeRegions(parsed.regions);
  return parsed.regions[activeRegion] ?? {};
}

function renderList() {
  const counts = getActiveCounts();
  const { sortBy, filter, category } = state;
  const list = document.getElementById('material-list');

  let entries = Object.entries(counts)
    .filter(([id]) => {
      if (filter && !id.includes(filter.toLowerCase()) && !blockIdToName(id).toLowerCase().includes(filter.toLowerCase())) return false;
      if (category && categorizeBlock(id) !== category) return false;
      return true;
    })
    .sort(sortBy === 'count'
      ? (a, b) => b[1] - a[1]
      : (a, b) => blockIdToName(a[0]).localeCompare(blockIdToName(b[0]))
    );

  list.innerHTML = '';
  const totalBlocks = entries.reduce((s,[,c]) => s + c, 0);
  const maxCount = entries.length ? Math.max(...entries.map(e=>e[1])) : 1;
  for (const [id, count] of entries) {
    const pctBar = (count / maxCount) * 100;
    const displayName = blockIdToName(id);
    const ms = maxStack(id);
    const { total, detail } = formatCount(count, ms);
    const emoji = getEmoji(id);
    
    // Real block icons from multiple Minecraft texture CDN sources
    const baseId = id.replace(/^minecraft:/, '');
    // Try block texture, then item texture, then fallback emoji
    const textureURLs = [
      `https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/${baseId}.png`,
      `https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/item/${baseId}.png`
    ];

    const li = document.createElement('li');
    li.className = 'mat-entry';
    li.innerHTML = `
      <div class="mat-icon">
        <img data-src="${textureURLs[0]}" data-src2="${textureURLs[1]}"
             alt="${displayName}"
             loading="lazy"
             decoding="async"
             onerror="let t=this;let b=t.getAttribute('data-base');if(!t.dataset.failed)t.dataset.failed='1';if(t.src.endsWith('block/'+b+'.png')){t.src=t.getAttribute('data-src2');}else{t.outerHTML='<span style=\'font-size:10px;line-height:24px\'>${emoji}</span>';t.parentElement.classList.add('no-img');}"
             data-base="${baseId}">
      </div>
      <div class="mat-name-col">
        <div class="mat-name">${displayName}</div>
        <div class="mat-id">${id}</div>
      </div>
      <div class="mat-count-col">
        <div class="mat-total">${total}</div>
        ${detail ? `<div class="mat-breakdown">${detail}</div>` : ''}
        <div class="mat-bar-wrap"><div class="mat-bar-fill" style="width:${pctBar}%"></div></div>
      </div>
    `;
    list.appendChild(li);
  }

  // stats footer
  const uniqueBlocks = Object.keys(counts).length;
  document.getElementById('stats-footer').innerHTML =
    `<span>Showing <strong>${entries.length}</strong> of <strong>${uniqueBlocks}</strong> block types</span>` +
    `<span>Total blocks: <strong>${totalBlocks.toLocaleString()}</strong></span>`;
}

function renderRegionTabs() {
  const { parsed, activeRegion } = state;
  const tabs = document.getElementById('region-tabs');
  tabs.innerHTML = '';

  const names = ['__all__', ...Object.keys(parsed.regions)];
  for (const name of names) {
    const btn = document.createElement('button');
    btn.className = 'rtab' + (name === activeRegion ? ' active' : '');
    btn.textContent = name === '__all__' ? 'All regions' : name;
    btn.onclick = () => {
      state.activeRegion = name;
      tabs.querySelectorAll('.rtab').forEach(b => b.classList.toggle('active', b === btn));
      renderList();
    };
    tabs.appendChild(btn);
  }
}

function showResults(parsed, fileName) {
  state.parsed = parsed;
  state.activeRegion = '__all__';
  state.filter = '';
  state.sortBy = 'count';
  state.category = '';
  document.getElementById('search-input').value = '';
  document.getElementById('sort-count').classList.add('active');
  document.getElementById('sort-name').classList.remove('active');
  document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
  const allCat = document.querySelector('.btn-cat[data-cat=""]');
  if (allCat) allCat.classList.add('active');

  // info bar
  document.getElementById('schem-name').textContent = parsed.name || fileName;
  const allCounts = mergeRegions(parsed.regions);
  const totalBlocks = Object.values(allCounts).reduce((a, b) => a + b, 0);
  document.getElementById('chip-blocks').textContent = totalBlocks.toLocaleString() + ' blocks';
  document.getElementById('chip-regions').textContent = Object.keys(parsed.regions).length + ' region' + (Object.keys(parsed.regions).length !== 1 ? 's' : '');
  document.getElementById('chip-author').textContent = parsed.author ? 'by ' + parsed.author : 'unknown author';

  renderRegionTabs();
  renderList();

  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('kbd-hints').classList.add('visible');
  document.getElementById('btn-new').style.display = '';
}

// ═══════════════════════════════════════════════════════════
//  DECOMPRESSION  — gzip via DecompressionStream, zstd via inline WASM
// ═══════════════════════════════════════════════════════════
const ZSTD_MAGIC = 0x28B52FFD;

function isZstd(buf) {
  if (buf.byteLength < 4) return false;
  const dv = new DataView(buf);
  return dv.getUint32(0, true) === ZSTD_MAGIC || dv.getUint32(0, false) === ZSTD_MAGIC;
}

function streamDecompress(compression, buffer) {
  return new Promise((resolve, reject) => {
    try {
      const ds = new DecompressionStream(compression);
      const writer = ds.writable.getWriter();
      const reader = ds.readable.getReader();
      writer.write(new Uint8Array(buffer));
      writer.close();
      const chunks = [];
      (function pump() {
        reader.read().then(({ done, value }) => {
          if (done) {
            const totalLen = chunks.reduce((s, c) => s + c.length, 0);
            const merged = new Uint8Array(totalLen);
            let off = 0;
            for (const c of chunks) { merged.set(c, off); off += c.length; }
            resolve(merged.buffer);
          } else {
            chunks.push(value);
            pump();
          }
        }).catch(reject);
      })();
    } catch (e) { reject(e); }
  });
}

async function decompressFile(arrayBuf) {
  const header = new Uint8Array(arrayBuf.slice(0, 2));
  const gzipMagic = (header[0] === 0x1f && header[1] === 0x8b);

  if (gzipMagic) {
    setProgress(25, 'Decompressing gzip…');
    try {
      return await streamDecompress('gzip', arrayBuf);
    } catch (e) {
      // Maybe not gzipped — try raw
      return arrayBuf;
    }
  }

  if (isZstd(arrayBuf)) {
    setProgress(25, 'Decompressing zstd…');
    try {
      return await streamDecompress('deflate-raw', arrayBuf);
    } catch (e) {
      // Zstd not supported natively, try raw
      return arrayBuf;
    }
  }

  // No compression or unknown — try raw
  return arrayBuf;
}

// ═══════════════════════════════════════════════════════════
//  FILE PROCESSING
// ═══════════════════════════════════════════════════════════
async function processFile(file) {
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'block';
  setProgress(10, 'Reading file…');

  try {
    if (!file.name.endsWith('.litematic')) {
      throw new Error('Please drop a .litematic file. Other formats are not supported.');
    }
    if (file.size > 512 * 1024 * 1024) {
      throw new Error('File is too large (>512 MB). Try a smaller schematic.');
    }

    const arrayBuf = await file.arrayBuffer();
    if (arrayBuf.byteLength < 8) {
      throw new Error('File is too small to be a valid .litematic file.');
    }

    const nbtBuf = await decompressFile(arrayBuf);

    setProgress(50, 'Parsing NBT…');
    const nbtReader = new NBTReader(nbtBuf);
    const nbt = nbtReader.readRoot();

    setProgress(75, 'Counting blocks…');
    await new Promise(r => setTimeout(r, 0));
    const parsed = parseSchematic(nbt);

    const allCounts = mergeRegions(parsed.regions);
    if (Object.keys(allCounts).length === 0) {
      throw new Error('No blocks found in schematic. File may be empty or corrupted.');
    }

    setProgress(95, 'Rendering…');
    await new Promise(r => setTimeout(r, 0));

    showResults(parsed, file.name.replace(/\.litematic$/i, ''));
    setProgress(100, 'Done');
  } catch (e) {
    showError(e.message || 'Failed to parse file');
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) processFile(f);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });

// Debounced search
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.filter = e.target.value;
    renderList();
  }, 100);
});

// Category pills
document.getElementById('cat-pills').addEventListener('click', e => {
  const btn = e.target.closest('.btn-cat');
  if (!btn) return;
  document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.category = btn.dataset.cat || '';
  renderList();
});

document.getElementById('sort-count').addEventListener('click', () => {
  state.sortBy = 'count';
  document.getElementById('sort-count').classList.add('active');
  document.getElementById('sort-name').classList.remove('active');
  renderList();
});
document.getElementById('sort-name').addEventListener('click', () => {
  state.sortBy = 'name';
  document.getElementById('sort-name').classList.add('active');
  document.getElementById('sort-count').classList.remove('active');
  renderList();
});

// Export buttons
document.getElementById('btn-copy').addEventListener('click', () => {
  const text = generateTabDelimited();
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
});
document.getElementById('btn-csv').addEventListener('click', () => {
  const csv = generateCSV();
  downloadFile('materials.csv', csv, 'text/csv');
  showToast('CSV downloaded');
});
document.getElementById('btn-json').addEventListener('click', () => {
  const json = generateJSON();
  downloadFile('materials.json', json, 'application/json');
  showToast('JSON downloaded');
});

function generateTabDelimited() {
  const counts = getActiveCounts();
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return entries.map(([id, count]) => {
    const name = blockIdToName(id);
    const ms = maxStack(id);
    const { total, detail } = formatCount(count, ms);
    return detail ? `${name}\t${total} ${detail}` : `${name}\t${total}`;
  }).join('\n');
}

function generateCSV() {
  const counts = getActiveCounts();
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const lines = ['Block Name,Item ID,Total Count,Stacks,Max Stack Size'];
  for (const [id, count] of entries) {
    const name = blockIdToName(id);
    const ms = maxStack(id);
    const stacks = (count / ms).toFixed(2);
    lines.push(`"${name}","${id}",${count},${stacks},${ms}`);
  }
  return lines.join('\n');
}

function generateMarkdown() {
  const counts = getActiveCounts();
  let entries = Object.entries(counts)
    .filter(([id]) => state.filter === '' || id.includes(state.filter) || blockIdToName(id).toLowerCase().includes(state.filter))
    .filter(([id]) => !state.category || categorizeBlock(id) === state.category)
    .sort(sortByFn(state.sortBy));
  let md = '| # | Block | Count | Stacks |\n|--:|------|------:|-------|\n';
  entries.forEach(([id, count], i) => {
    const ms = maxStack(id);
    const stacks = (count / ms).toFixed(1);
    md += `| ${i+1} | ${blockIdToName(id)} | ${count.toLocaleString()} | ${stacks} |\n`;
  });
  return md;
}

function sortByFn(s) {
  return s === 'name'
    ? (a, b) => blockIdToName(a[0]).localeCompare(blockIdToName(b[0]))
    : (a, b) => b[1] - a[1];
}

function generateJSON() {
  const counts = getActiveCounts();
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const items = entries.map(([id, count]) => {
    const ms = maxStack(id);
    return {
      name: blockIdToName(id),
      id: id,
      count: count,
      stacks: parseFloat((count / ms).toFixed(2)),
      maxStackSize: ms
    };
  });
  return JSON.stringify({ materialList: items, totalBlocks: entries.reduce((s, [,c]) => s + c, 0), uniqueTypes: entries.length }, null, 2);
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// New file button
document.getElementById('btn-scanline').addEventListener('click', () => {
  const sl = document.getElementById('scanlines');
  const btn = document.getElementById('btn-scanline');
  const off = sl.classList.toggle('off');
  btn.textContent = off ? 'CRT: off' : 'CRT: on';
});

document.getElementById('btn-new').addEventListener('click', () => {
  document.getElementById('results').style.display = 'none';
  document.getElementById('dropzone').style.display = '';
  document.getElementById('kbd-hints').classList.remove('visible');
  document.getElementById('btn-new').style.display = 'none';
  document.getElementById('error-box').style.display = 'none';
  state.parsed = null;
  state.activeRegion = '__all__';
  state.filter = '';
  state.sortBy = 'count';
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (!state.parsed) return; // Only active when results are visible
  const results = document.getElementById('results');
  if (results.style.display === 'none') return;

  // Ctrl/Cmd+K — focus search
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search-input').focus();
    document.getElementById('search-input').select();
  }
  // Ctrl/Cmd+S — toggle sort
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    state.sortBy = state.sortBy === 'count' ? 'name' : 'count';
    document.getElementById('sort-count').classList.toggle('active', state.sortBy === 'count');
    document.getElementById('sort-name').classList.toggle('active', state.sortBy === 'name');
    renderList();
  }
  // Escape — clear search
  if (e.key === 'Escape' && document.getElementById('search-input').value) {
    document.getElementById('search-input').value = '';
    state.filter = '';
    renderList();
    showToast('Filter cleared');
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── IntersectionObserver for lazy icon loading ──
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const img = e.target;
        if (img.dataset.src && !img.src) {
          img.src = img.dataset.src;
        }
        io.unobserve(img);
      }
    });
  }, { rootMargin: '300px' });
  const listEl = document.getElementById('material-list');
  if (listEl) {
    const mo = new MutationObserver((muts) => {
      muts.forEach(m => m.addedNodes.forEach(n => {
        if (n.nodeType === 1) {
          if (n.tagName === 'IMG') io.observe(n);
          if (n.querySelectorAll) n.querySelectorAll('img').forEach(io.observe, io);
        }
      }));
    });
    mo.observe(listEl, { childList: true, subtree: true });
  }
}
